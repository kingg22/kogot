# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Kotlin CI with Gradle

on:
  push:
    # Only long-lived branches: feature branches get CI through their PR (saves Actions minutes).
    branches:
      - main
      - master
      - dev
  pull_request:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:

concurrency:
    # PRs: one group per PR, so a new commit cancels the run of the commit it replaces.
    # Pushes and manual runs: one group per commit. GitHub keeps a single pending run per group and
    # replaces it when another is queued, so a per-branch group would leave queued commits without a
    # result. Builds that already ran for the same content are skipped by the pre_job below.
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Skips the build when a successful run already exists for the same content (tree hash), from a PR or
  # a push: e.g. the push to main after a squash/rebase merge of a PR that already passed, or a push and
  # its PR's synchronize event for the same commit. Manual runs always build.
  pre_job:
    runs-on: ubuntu-latest
    # Minimum permissions documented by skip-duplicate-actions.
    permissions:
      actions: write
      contents: read
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          concurrent_skipping: same_content_newer
          skip_after_successful_duplicate: 'true'
          do_not_skip: '["workflow_dispatch", "schedule"]'

  build:
    needs: pre_job
    # Skip Renovate's and Dependabot's PRs and commits. Inside Actions the bots' logins are
    # `renovate[bot]` / `dependabot[bot]` (`app/renovate` is only how the `gh` CLI prints them).
    # `actor` is the authenticated identity (the bots' own pushes); `pull_request.user` still matches
    # when someone else re-runs or rebases the bot's PR. The commit author is not used: anyone can set
    # it to a bot's no-reply address. A skipped job counts as passing for required status checks.
    # `!cancelled()` instead of the implicit `success()`: if pre_job fails, its output is empty and the
    # build runs, so a broken duplicate check can never turn into a green skipped build.
    if: >-
      !cancelled() &&
      needs.pre_job.outputs.should_skip != 'true' &&
      github.actor != 'renovate[bot]' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    # Free GitHub Actions Environment Disk Space
    - name: Maximize Build Space
      uses: jlumbroso/free-disk-space@v2.0.0
      with:
        tool-cache: false
        large-packages: false

    - uses: actions/checkout@v7
      #with:
        #fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: '24'
        distribution: 'temurin'
        cache: 'gradle'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Cache konan
      uses: actions/cache@v6
      with:
        path: |
          ~/.konan
        key: ${{ runner.os }}-konan
        restore-keys: ${{ runner.os }}-konan

#    - name: Cache SonarQube packages
#      uses: actions/cache@v5
#      if: >
#        ${{
#          github.actor != 'app/renovate' &&
#          (
#            (github.event_name == 'pull_request' &&
#                github.event.pull_request.base.ref == 'main' &&
#                github.event.pull_request.user.login != 'app/dependabot') ||
#            (github.event_name == 'push' && github.ref == 'refs/heads/main')
#          )
#        }}
#      with:
#        path: ~/.sonar/cache
#        key: ${{ runner.os }}-sonar
#        restore-keys: ${{ runner.os }}-sonar

    - name: Change wrapper permissions
      run: chmod +x ./gradlew

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      with:
          cache-read-only: false
          validate-wrappers: true

    - name: Build with Gradle Wrapper
      # Run without a daemon when only run one task
      run: ./gradlew build --no-daemon --stacktrace

#    # With configuration cache parallel, the KMP plugin fails with ConcurrentModificationException
#    - name: Sonar analyze
#      run: ./gradlew sonar --info -Dsonar.verbose=true
#      if: >
#        ${{
#          github.actor != 'app/renovate' &&
#          (
#            (github.event_name == 'pull_request' &&
#                github.event.pull_request.base.ref == 'main' &&
#                github.event.pull_request.user.login != 'app/dependabot') ||
#            (github.event_name == 'push' && github.ref == 'refs/heads/main')
#          )
#        }}
#      env:
#        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    - name: Upload reports (if build failed)
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: reports
        path: './**/build/reports/'

    # NOTE: The Gradle Wrapper is the default and recommended way to run Gradle (https://docs.gradle.org/current/userguide/gradle_wrapper.html).
    # If your project does not have the Gradle Wrapper configured, you can use the following configuration to run Gradle with a specified version.
    #
    # - name: Setup Gradle
    #   uses: gradle/actions/setup-gradle@v4
    #   with:
    #     gradle-version: '8.9'
    #
    # - name: Build with Gradle 8.9
    #   run: gradle build

  dependency-submission:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: '24'
        distribution: 'temurin'
        cache: 'gradle'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Change wrapper permissions
      run: chmod +x ./gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      with:
          validate-wrappers: false
          cache-read-only: true

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
